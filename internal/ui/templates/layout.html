<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHub Mirror - {{block "title" .}}Dashboard{{end}}</title>
    <script src="https://unpkg.com/htmx.org@1.9.12"></script>
    <style>
        :root {
            --bg: linear-gradient(180deg, #eef3f8 0%, #f8fafc 45%, #ffffff 100%);
            --surface: #ffffff;
            --surface-muted: #f6f8fa;
            --border: #d0d7de;
            --text: #1f2937;
            --muted: #667085;
            --nav: #24292f;
            --accent: #2da44e;
            --accent-soft: #dafbe1;
            --danger: #cf222e;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: "Segoe UI", "Helvetica Neue", sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
        .container { max-width: 1120px; margin: 0 auto; padding: 1.5rem 1rem 3rem; }
        nav { background: var(--nav); color: #fff; padding: 0.9rem 1rem; display: flex; align-items: center; gap: 1.5rem; flex-wrap: wrap; box-shadow: 0 10px 30px rgba(15, 23, 42, 0.12); }
        nav a { color: #fff; text-decoration: none; }
        nav a:hover { text-decoration: underline; }
        nav .title { font-size: 1.25rem; font-weight: 700; letter-spacing: 0.01em; }
        .page-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 1rem; margin-bottom: 1.25rem; }
        .page-header h1 { font-size: 2.5rem; line-height: 1.05; margin: 0; }
        .page-header p { color: var(--muted); max-width: 42rem; margin-top: 0.35rem; }
        .card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 1rem; margin-bottom: 1rem; box-shadow: 0 16px 40px rgba(15, 23, 42, 0.05); }
        .btn { display: inline-block; padding: 0.65rem 1rem; border: 1px solid var(--border); border-radius: 10px; background: var(--surface-muted); cursor: pointer; font-size: 0.875rem; font-weight: 600; text-decoration: none; color: #24292f; }
        .btn-primary { background: var(--accent); color: #fff; border-color: var(--accent); }
        .btn-danger { background: var(--danger); color: #fff; border-color: var(--danger); }
        .btn-sm { padding: 0.45rem 0.75rem; }
        .btn:hover { opacity: 0.9; }
        .form-grid { display: grid; gap: 1rem; }
        .form-section { padding: 1rem; background: linear-gradient(180deg, #ffffff 0%, #fbfdff 100%); border: 1px solid var(--border); border-radius: 12px; }
        .form-section h3 { margin-bottom: 0.25rem; }
        .form-section p { color: var(--muted); margin-bottom: 0.9rem; }
        .grid-two { display: grid; gap: 1rem; grid-template-columns: repeat(2, minmax(0, 1fr)); }
        .form-group { margin-bottom: 0.85rem; }
        .form-group label { display: block; font-weight: 600; margin-bottom: 0.25rem; font-size: 0.875rem; }
        .form-group input[type="text"], .form-group input[type="password"], .form-group input[type="url"] { width: 100%; padding: 0.75rem; border: 1px solid var(--border); border-radius: 10px; font-size: 0.95rem; background: #fff; }
        .form-group .checkbox { display: flex; align-items: center; gap: 0.5rem; }
        .form-group .checkbox label { margin: 0; }
        .table-card { padding: 0; overflow: hidden; }
        .table-card .table-header { padding: 1rem 1rem 0; }
        table { width: 100%; border-collapse: collapse; }
        th, td { text-align: left; padding: 0.8rem 1rem; border-bottom: 1px solid var(--border); font-size: 0.92rem; }
        th { background: #f8fafc; font-weight: 700; color: #344054; }
        .badge { display: inline-block; padding: 0.125rem 0.5rem; border-radius: 999px; font-size: 0.75rem; font-weight: 600; }
        .badge-ok { background: var(--accent-soft); color: #1a7f37; }
        .badge-error { background: #ffebe9; color: #cf222e; }
        .badge-pending { background: #fff8c5; color: #9a6700; }
        .flash { padding: 0.9rem 1rem; border-radius: 12px; margin-bottom: 1rem; font-weight: 500; }
        .flash-success { background: #dafbe1; border: 1px solid #1a7f37; }
        .flash-error { background: #ffebe9; border: 1px solid #cf222e; }
        .inline { display: inline; }
        .actions { display: flex; gap: 0.5rem; flex-wrap: wrap; }
        .mt-1 { margin-top: 0.5rem; }
        .mb-1 { margin-bottom: 0.5rem; }
        .text-muted { color: var(--muted); font-size: 0.92rem; }
        .stack { display: grid; gap: 1rem; }
        .split { display: grid; gap: 1rem; grid-template-columns: 1.2fr 0.8fr; align-items: start; }
        .empty-state { text-align: center; padding: 3.5rem 2rem; background: radial-gradient(circle at top, #f8fbff 0%, #ffffff 55%); }
        .empty-state h2 { font-size: 1.65rem; margin-bottom: 0.5rem; }
        .empty-state p { color: var(--muted); max-width: 34rem; margin: 0 auto 1rem; }
        code { background: #eef2f6; padding: 0.125rem 0.25rem; border-radius: 6px; font-size: 0.875rem; }

        @media (max-width: 720px) {
            .container { padding: 0.75rem; }
            .page-header { flex-direction: column; }
            .page-header h1 { font-size: 2rem; }
            .grid-two, .split { grid-template-columns: 1fr; }
            table, thead, tbody, tr, th, td { display: block; }
            thead { display: none; }
            tr { border: 1px solid #d0d7de; border-radius: 6px; background: #fff; margin-bottom: 0.75rem; overflow: hidden; }
            td { border-bottom: 1px solid #d0d7de; }
            td:last-child { border-bottom: none; }
            .btn, button.btn { width: 100%; text-align: center; }
            .inline { display: block; width: 100%; }
            .actions { flex-direction: column; }
        }

        /* HTMX loading indicator */
        .htmx-indicator { opacity: 0; transition: opacity 200ms ease-in; }
        .htmx-request .htmx-indicator { opacity: 1; }
        .htmx-request.htmx-indicator { opacity: 1; }
    </style>
</head>
<body hx-boost="true">
    <nav>
        <span class="title">GitHub Mirror</span>
        <a href="/">Dashboard</a>
        <a href="/mirrors/new">New Mirror</a>
        <a href="/guide">PAT Tokens & Webhook Setup</a>
    </nav>
    <div class="container">
        {{block "content" .}}{{end}}
    </div>
</body>
</html>
